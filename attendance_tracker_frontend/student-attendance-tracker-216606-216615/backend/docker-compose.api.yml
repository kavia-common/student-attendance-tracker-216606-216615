version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: attendance_postgres_stack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data_stack:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ./node-api
    container_name: attendance_api_stack
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./node-api/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db_data_stack:
